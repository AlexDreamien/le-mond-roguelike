[project]
name = "le-mond-roguelike"
version = "14.0.0"
description = "A turn-based roguelike built with PyGame: procedural dungeons, combat, loot, and skills."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["pygame>=2.5,<3.0"]

[project.scripts]
le-mond-roguelike = "lemond_pygame.__main__:main"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
