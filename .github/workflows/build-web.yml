name: Build web (pygbag)

# Builds the browser/WASM version with pygbag and (on main) publishes it to
# GitHub Pages as a playable demo. The build job always uploads the static site
# as an artifact, so the build is verified even before Pages is enabled.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". After that, pushes to main auto-deploy the playable demo.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag

      - name: Build WASM bundle
        # Packages main.py + the lemond_pygame package (code, assets, locales)
        # into build/web/. --build skips the local test server.
        run: python -m pygbag --build main.py

      - uses: actions/upload-artifact@v4
        with:
          name: le-mond-roguelike-web
          path: build/web

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
