name: Build Windows exe

# Builds a single-file le-mond-pygame.exe on a Windows runner via the spec
# (which bundles assets/locales + pygame). Run from the Actions tab or a v* tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --clean le-mond-pygame.spec

      - uses: actions/upload-artifact@v4
        with:
          name: le-mond-roguelike-windows
          path: dist/le-mond-pygame.exe

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/le-mond-pygame.exe
